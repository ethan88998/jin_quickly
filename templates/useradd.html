<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>新增用户</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f6fa;
      margin: 0;
    }

    .layout {
      display: flex;
      justify-content: center;
      padding: 40px 0;
    }

    .form-box {
      width: 400px;
      background: #fff;
      border-radius: 6px;
      border: 1px solid #dcdfe6;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 20px;
      color: #333;
    }

    .form-item {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    .form-item label {
      width: 80px;
      font-size: 14px;
      color: #333;
    }

    .form-item input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      font-size: 14px;
    }

    .btns {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      padding: 6px 16px;
      border-radius: 4px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-cancel {
      background: #fff;
      border: 1px solid #dcdfe6;
      color: #555;
    }

    .btn-cancel:hover {
      background: #f0f0f0;
    }

    .btn-save {
      background: #1890ff;
      color: #fff;
    }

    .btn-save:hover {
      background: #40a9ff;
    }
  </style>
</head>
<body>

<div class="layout">
  <div class="form-box">
    <h2>新增用户</h2>

    <div class="form-item">
      <label>用户名</label>
      <input id="username" placeholder="请输入用户名">
    </div>

    <div class="form-item">
      <label>密码</label>
      <input id="password" type="password" placeholder="请输入密码">
    </div>

    <div class="form-item">
      <label>年龄</label>
      <input id="age" type="number" placeholder="请输入年龄">
    </div>

    <div class="form-item">
      <label>Email</label>
      <input id="email" placeholder="请输入邮箱">
    </div>

    <div class="btns">
      <button class="btn btn-cancel" onclick="history.back()">取消</button>
      <button class="btn btn-save" onclick="submitUser()">保存</button>
    </div>
  </div>
</div>

<script src="/static/js/useradd.js"></script>
</body>
</html>
